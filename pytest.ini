[pytest]
# parity_test.py is a real standalone script (run directly: python core/scripts/parity_test.py),
# not a pytest test module -- but its filename matches pytest's default *_test.py collection
# pattern, which would otherwise import it during every test run. Ignored here rather than
# renamed, so the documented "python ... parity_test.py" usage keeps working.
addopts = --ignore=core/scripts/parity_test.py --import-mode=importlib
